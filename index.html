<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生猪产业数据看板</title>
<style>
  :root{
    --bg:#f2f5f9; --card:#fff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --brand:#1d4ed8; --brand-soft:#eff6ff; --red:#dc2626; --red-soft:#fef2f2;
    --green:#16a34a; --green-soft:#f0fdf4; --amber:#b45309; --amber-soft:#fffbeb;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  .app{max-width:1500px;margin:0 auto;padding:26px 22px 40px}

  header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--brand),#60a5fa)}
  .brand{display:flex;align-items:center;gap:16px;min-width:0}
  .logo{width:48px;height:48px;flex:0 0 48px;border-radius:14px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:26px}
  .brand h1{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
  .brand p{font-size:13px;color:var(--sub);margin-top:4px}
  .header-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 15px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .18s}
  .btn:hover{background:#f8fafc;border-color:#cbd5e1}
  .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{background:#1e40af}
  .btn.success{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.success:hover{background:#15803d}

  .meta-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .meta-chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--sub);box-shadow:var(--shadow)}
  .meta-chip b{color:var(--ink);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 7px}

  .tabs{display:flex;gap:6px;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);overflow-x:auto}
  .tab{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;color:var(--sub);font-size:14.5px;font-weight:600;cursor:pointer;padding:12px 18px;border-radius:10px;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:9px}
  .tab:hover{background:#f8fafc;color:var(--ink)}
  .tab.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.25)}
  .tab .num{font-size:11px;font-weight:700;width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:#eef2f7;color:var(--sub)}
  .tab.active .num{background:rgba(255,255,255,.22);color:#fff}

  .panel{display:none;margin-top:20px}
  .panel.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .panel-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px 26px;box-shadow:var(--shadow)}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .panel-head h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
  .panel-head h2 .bar{width:4px;height:20px;border-radius:2px;background:var(--brand)}
  .panel-head p{font-size:13px;color:var(--sub);margin-top:6px;padding-left:14px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{position:relative}
  .search input{border:1px solid var(--line);border-radius:9px;padding:9px 12px 9px 36px;font-size:13px;width:210px;outline:none;transition:all .18s;color:var(--ink);background:#fff}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:none;stroke:var(--sub);stroke-width:2}
  .rowcount{font-size:12px;color:var(--sub)}

  .table-wrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px;background:#fff}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  th,td{padding:9px 11px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  thead th{position:sticky;top:0;z-index:3;background:#f1f5f9;font-weight:700;color:#334155;cursor:pointer;user-select:none;transition:background .15s}
  thead th:hover{background:#e2e8f0}
  thead th.sticky-col{left:0;z-index:5;min-width:132px}
  thead th .sort-ind{display:inline-block;margin-left:4px;color:#94a3b8;font-size:10px}
  thead th.sorted .sort-ind{color:var(--brand)}
  tbody th{position:sticky;left:0;z-index:2;background:#f8fafc;font-weight:600;text-align:left;min-width:132px;color:#334155}
  tbody tr:hover td,tbody tr:hover th{background:#f8fafc}
  tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
  th:last-child,td:last-child{border-right:0}
  /* special rows */
  tr.last-row th,tr.last-row td{background:#fffbeb!important;font-weight:700;color:#92400e;border-top:2px solid #fbbf24}
  tr.sum-row th,tr.sum-row td{background:#eff6ff!important;font-weight:700;color:#1e40af;border-top:2px solid #3b82f6}
  tr.delta-row th,tr.delta-row td{background:#f8fafc!important;font-weight:600}
  /* value coloring */
  td.pos{color:var(--red);font-weight:600}
  td.neg{color:var(--green);font-weight:600}
  td.mark{background:var(--red-soft)!important;color:var(--red);font-weight:700}
  td.mark-green{background:var(--green-soft)!important;color:var(--green);font-weight:700}
  td.hl{background:#fffbeb!important;color:#92400e;font-weight:700}
  td.empty{color:#cbd5e1}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:14px;align-items:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:26px}

  #toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:#0f172a;color:#fff;font-size:13.5px;padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:720px){
    .app{padding:14px 10px 30px}
    header{padding:16px;border-radius:14px}
    .brand h1{font-size:18px}.brand p{font-size:12px}
    .logo{width:40px;height:40px;flex-basis:40px;font-size:22px}
    .tab{font-size:13px;padding:11px 12px}
    .panel-card{padding:16px 12px}
    .search input{width:160px}
    table{font-size:11.5px}
    th,td{padding:7px 8px}
    tbody th,thead th.sticky-col{min-width:110px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🐖</div>
      <div><h1>生猪产业数据看板</h1><p>出栏体重 · 屠宰量 · 养殖企业出栏进度</p></div>
    </div>
    <div class="header-actions">
      <button class="btn primary" id="shareBtn">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
        分享链接
      </button>
    </div>
  </header>

  <div class="meta-strip">
    <span class="meta-chip"><span class="dot"></span>数据截至 <b>11月26日</b></span>
    <span class="meta-chip">数据已转为 <b>可搜索 / 可排序 / 可复制</b> 的表格</span>
    <span class="meta-chip">支持 <b>导出 CSV</b></span>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="weight" role="tab"><span class="num">1</span>出栏体重</button>
    <button class="tab" data-tab="slaughter" role="tab"><span class="num">2</span>屠宰量</button>
    <button class="tab" data-tab="progress" role="tab"><span class="num">3</span>养殖企业出栏进度</button>
  </nav>

  <main id="panels"></main>
  <footer>数据来源：行业跟踪数据 · 仅供内部参考</footer>
</div>
<div id="toast"></div>

const META = {
  weight:{ desc:'各区域生猪出栏体重日度跟踪（2026/7/27 — 2026/11/23）及周环比变化', lastRow:'delta' },

function num(v){
  if(v==null||v==='') return null;
  const s=String(v).replace(/[(),%]/g,'').trim();
  if(s==='') return null;
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}
function cellClass(value,colIndex,totalCols,key){
  const n=num(value);
  const s=String(value);
  if(key==='weight'){
    if(colIndex===totalCols-1) return 'hl';
    if(n!==null && s.includes('-')) return 'neg';
    if(n!==null && s.includes('.')) return 'pos';
  }
  if(key==='slaughter'){
    if(colIndex===totalCols-1){
      if(n===null) return '';
      return n>0?'mark':'mark-green';
    }
    if(colIndex>=2 && n!==null){
      // color change vs previous day in same row is not available here; use row last value
    }
  }
  if(key==='progress'){
    if(colIndex===5 || colIndex===7 || colIndex===8 || colIndex===11){
      if(n===null) return '';
      if(colIndex===11 && s.startsWith('(')) return 'mark-green';
      return n>0?'pos':(n<0?'neg':'');
    }
    if((colIndex===4||colIndex===9||colIndex===10) && n!==null && n>=100) return 'mark';
  }
  return '';
}
function isNegativeText(v){const s=String(v);return s.startsWith('-')||s.startsWith('(');}

const state={weight:{q:'',sortCol:-1,sortDir:1},slaughter:{q:'',sortCol:-1,sortDir:1},progress:{q:'',sortCol:-1,sortDir:1}};

function renderTable(key){
  const t=DATA[key], meta=META[key], st=state[key];
  let rows=t.rows.map((r,i)=>({r,i}));
  if(st.q){
    const q=st.q.toLowerCase();
    rows=rows.filter(o=>o.r.some(c=>String(c).toLowerCase().includes(q)));
  }
  if(st.sortCol>=0){
    const ci=st.sortCol, dir=st.sortDir;
    rows.sort((a,b)=>{
      const av=num(a.r[ci]), bv=num(b.r[ci]);
      if(av!==null&&bv!==null) return (av-bv)*dir;
      const as=String(a.r[ci]||''), bs=String(b.r[ci]||'');
      return as.localeCompare(bs,'zh-CN')*dir;
    });
  }
  const lastIdx=t.rows.length-1;
  let html='<div class="panel-card"><div class="panel-head"><div><h2><span class="bar"></span>'+t.title+'</h2><p>'+meta.desc+'</p></div>'+
    '<div class="tools"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.65" y2="16.65"/></svg><input type="search" placeholder="搜索表格内容…" data-search="'+key+'" value="'+st.q.replace(/"/g,'&quot;')+'"></div>'+
    '<button class="btn success" data-export="'+key+'"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出 CSV</button>'+
    '<span class="rowcount" data-count="'+key+'">'+rows.length+' / '+t.rows.length+' 行</span></div></div>'+
    '<div class="table-wrap"><table><thead><tr>';
  t.headers.forEach((h,i)=>{
    const sorted=st.sortCol===i;
    html+='<th class="'+(i===0?'sticky-col':'')+(sorted?' sorted':'')+'" data-col="'+i+'" data-key="'+key+'" title="点击排序">'+h+'<span class="sort-ind">'+(sorted?(st.sortDir>0?'▲':'▼'):'↕')+'</span></th>';
  });
  html+='</tr></thead><tbody>';
  rows.forEach(o=>{
    const r=o.r, orig=o.i;
    let trCls='';
    if(orig===lastIdx){
      if(key==='weight') trCls='last-row';
      else if(key==='slaughter') trCls='sum-row';
    }
    html+='<tr'+(trCls?' class="'+trCls+'"':'')+'>';
    r.forEach((cell,i)=>{
      const tag=i===0?'th':'td';
      const cls=i===0?'':cellClass(cell,i,t.headers.length,key);
      html+='<'+tag+' class="'+cls+'">'+(cell===''?'&nbsp;':cell)+'</'+tag+'>';
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  if(key==='weight') html+='<div class="legend"><span><i style="background:#fef2f2"></i>体重上升（环比为正）</span><span><i style="background:#f0fdf4"></i>体重下降（环比负）</span><span><i style="background:#fffbeb"></i>加权平均</span><span>最后一行「周环比」= 11/23 相对 11/16 的变化</span></div>';
  if(key==='slaughter') html+='<div class="legend"><span><i style="background:#fef2f2"></i>增减幅度为正</span><span><i style="background:#f0fdf4"></i>增减幅度为负</span><span>合计行数据为逐日各厂次求和，已核对与原始表一致</span></div>';
  if(key==='progress') html+='<div class="legend"><span><i style="background:#fef2f2"></i>完成率≥100% / 环比上升</span><span><i style="background:#f0fdf4"></i>环比下降 / 剩余为负</span><span>括号表示负数</span></div>';
  html+='</div>';
  return html;
}

function renderAll(){
  const panels=document.getElementById('panels');
  panels.innerHTML=Object.keys(DATA).map(k=>'<section class="panel'+((k==='weight')?' active':'')+'" id="panel-'+k+'" role="tabpanel">'+renderTable(k)+'</section>').join('');
  bindDynamic();
}
function bindDynamic(){
  document.querySelectorAll('[data-search]').forEach(el=>{
    el.addEventListener('input',function(){
      const k=this.dataset.search;
      state[k].q=this.value;
      const panel=document.getElementById('panel-'+k);
      const scroll=panel.querySelector('.table-wrap').scrollLeft;
      panel.innerHTML=renderTable(k);
      const wrap=document.getElementById('panel-'+k).querySelector('.table-wrap');
      wrap.scrollLeft=scroll;
      const input=document.getElementById('panel-'+k).querySelector('[data-search]');
      input.focus(); input.setSelectionRange(input.value.length,input.value.length);
      bindDynamic();
    });
  });
  document.querySelectorAll('[data-col]').forEach(th=>{
    th.addEventListener('click',function(){
      const k=this.dataset.key, ci=parseInt(this.dataset.col);
      if(state[k].sortCol===ci) state[k].sortDir*=-1;
      else {state[k].sortCol=ci;state[k].sortDir=1;}
      const panel=document.getElementById('panel-'+k);
      panel.innerHTML=renderTable(k);
      bindDynamic();
    });
  });
  document.querySelectorAll('[data-export]').forEach(btn=>{
    btn.addEventListener('click',function(){exportCSV(this.dataset.export);});
  });
}
function exportCSV(key){
  const t=DATA[key];
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[t.headers.map(esc).join(',')].concat(t.rows.map(r=>r.map(esc).join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=t.title+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  showToast('已导出 '+t.title+'.csv');
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2500);
}

// tabs
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    this.classList.add('active');
    const p=document.getElementById('panel-'+this.dataset.tab);
    if(p)p.classList.add('active');
    history.replaceState(null,'','#'+this.dataset.tab);
  });
});
const hash=location.hash.replace('#','');
if(hash && DATA[hash]){const t=document.querySelector('.tab[data-tab="'+hash+'"]');if(t)t.click();}

// share
document.getElementById('shareBtn').addEventListener('click',function(){
  const url=location.href.split('#')[0]+(location.hash||'');
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(url).then(()=>showToast('链接已复制，可直接分享')).catch(()=>fallback(url));
  } else fallback(url);
});
function fallback(url){
  const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast('链接已复制，可直接分享');}catch(e){showToast('复制失败，请手动复制地址栏链接');}
  document.body.removeChild(ta);
}

renderAll();
</script>
</body>
</html>
